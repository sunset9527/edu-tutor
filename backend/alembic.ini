[alembic]
# alembic.ini must stay ASCII-only: configparser reads it with the locale encoding (GBK on this machine)
script_location = alembic
prepend_sys_path = .
# sqlalchemy.url is overridden by app.core.config.settings in alembic/env.py
sqlalchemy.url = mysql+pymysql://root:123456@127.0.0.1:3306/edu_tutor?charset=utf8mb4

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
